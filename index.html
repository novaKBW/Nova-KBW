<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA: KBW — Kaun Banega Winner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --black: #080808;
    --black-2: #111111;
    --black-3: #1C1C1C;
    --black-4: #252525;
    --red: #CC0000;
    --red-dark: #990000;
    --red-glow: rgba(204,0,0,0.25);
    --white: #FFFFFF;
    --white-muted: #A0A0A0;
    --white-dim: #505050;
    --border: #2A2A2A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== AUTH SCREENS ===== */
  .auth-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
  }
  .auth-bg-pattern {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(204,0,0,0.08) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 79px, var(--border) 79px, var(--border) 80px),
      repeating-linear-gradient(90deg, transparent, transparent 79px, var(--border) 79px, var(--border) 80px);
  }
  .auth-card {
    background: var(--black-2);
    border: 1px solid var(--border);
    border-radius: 1.25rem;
    padding: 2.5rem;
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(204,0,0,0.08);
  }
  .nova-logo {
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--white);
  }
  .nova-logo span { color: var(--red); }
  .nova-sub {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--white-muted);
    margin-top: 0.35rem;
  }
  .form-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--white-muted);
    display: block;
    margin-bottom: 0.5rem;
  }
  .form-input {
    width: 100%;
    background: var(--black-3);
    border: 1px solid var(--border);
    border-radius: 0.625rem;
    padding: 0.85rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: var(--white);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-glow);
  }
  .form-input::placeholder { color: var(--white-dim); }
  .btn-primary {
    width: 100%;
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: 0.625rem;
    padding: 0.9rem 1.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
  }
  .btn-primary:hover {
    background: #DD0000;
    box-shadow: 0 4px 20px rgba(204,0,0,0.4);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #550000; cursor: not-allowed; opacity: 0.6; }
  .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }
  .otp-hint {
    background: rgba(204,0,0,0.08);
    border: 1px solid rgba(204,0,0,0.2);
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    font-size: 0.8rem;
    color: var(--white-muted);
  }
  .otp-hint strong { color: var(--red); }

  /* ===== DASHBOARD ===== */
  #screen-dashboard {
    background: var(--black);
  }
  .dashboard-header {
    padding: 0.9rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0;
    background: rgba(8,8,8,0.95);
    backdrop-filter: blur(12px);
    z-index: 10;
    gap: 0.75rem;
  }
  .profile-chip {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--black-3);
    border: 1px solid var(--border);
    border-radius: 3rem;
    padding: 0.4rem 1rem 0.4rem 0.4rem;
  }
  .profile-avatar {
    width: 2rem; height: 2rem;
    background: var(--red);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 800;
    color: white; flex-shrink: 0;
  }
  .profile-name { font-size: 0.82rem; font-weight: 600; }
  .profile-meta { font-size: 0.7rem; color: var(--white-muted); }
  .score-badge {
    background: var(--black-3);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.4rem 0.9rem;
    text-align: center;
  }
  .score-value { font-size: 1.25rem; font-weight: 800; color: var(--red); line-height: 1; }
  .score-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white-muted); }
  .dashboard-hero {
    padding: 1.5rem 1.25rem 1rem;
    text-align: center;
  }
  .dashboard-title {
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .dashboard-title span { color: var(--red); }
  .dashboard-subtitle { font-size: 0.85rem; color: var(--white-muted); margin-top: 0.5rem; }
  .levels-grid {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 0.5rem 1.25rem 2.5rem;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }
  .level-card {
    background: var(--black-2);
    border: 1px solid var(--border);
    border-radius: 0.875rem;
    padding: 1.1rem 1.25rem;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    width: 100%;
  }
  .level-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }
  .level-card.unlocked:hover {
    border-color: #444;
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .level-card.unlocked:hover::before { transform: scaleX(1); }
  .level-card.completed { border-color: #2A3A2A; }
  .level-card.completed::before { transform: scaleX(1); background: #22C55E; }
  .level-card.locked { opacity: 0.4; cursor: not-allowed; }
  .level-card.current { border-color: rgba(204,0,0,0.4); box-shadow: 0 0 20px rgba(204,0,0,0.1); }
  .level-card.current::before { transform: scaleX(1); animation: pulse-bar 2s ease-in-out infinite; }
  @keyframes pulse-bar {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .level-num {
    font-size: 0.65rem; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--white-dim); margin-bottom: 0.5rem;
  }
  .level-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; }
  .level-desc { font-size: 0.78rem; color: var(--white-muted); line-height: 1.4; }
  .level-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 0.85rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
  }
  .level-status {
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .status-locked { color: var(--white-dim); }
  .status-unlocked { color: #F59E0B; }
  .status-current { color: var(--red); }
  .status-completed { color: #22C55E; }
  .level-score { font-size: 0.85rem; font-weight: 700; color: var(--white-muted); }
  .level-score span { color: var(--white); }
  .lock-icon { font-size: 1rem; }

  /* ===== QUIZ SCREEN ===== */
  #screen-quiz {
    background: var(--black);
    position: relative;
  }
  .quiz-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--black-2);
    flex-wrap: wrap;
  }
  .quiz-level-badge {
    background: var(--red);
    color: white;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 0.375rem;
    padding: 0.3rem 0.7rem;
    flex-shrink: 0;
  }
  .quiz-progress-wrap { flex: 1; min-width: 120px; }
  .quiz-progress-label {
    font-size: 0.65rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--white-muted); margin-bottom: 0.35rem;
  }
  .quiz-progress-bar {
    height: 4px;
    background: var(--black-4);
    border-radius: 99px;
    overflow: hidden;
  }
  .quiz-progress-fill {
    height: 100%;
    background: var(--red);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .quiz-timer-wrap { text-align: right; flex-shrink: 0; }
  .quiz-timer {
    font-size: 1.5rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--white);
    transition: color 0.3s;
  }
  .quiz-timer.warning { color: #F59E0B; }
  .quiz-timer.danger { color: var(--red); animation: tick 1s ease infinite; }
  @keyframes tick {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .quiz-timer-label {
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--white-muted);
  }
  .quiz-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .question-number {
    font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--red); margin-bottom: 1.25rem;
    align-self: flex-start;
  }
  .question-text {
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    font-weight: 700;
    line-height: 1.55;
    color: var(--white);
    margin-bottom: 2rem;
    align-self: flex-start;
    width: 100%;
  }
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    width: 100%;
  }
  @media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
  .option-btn {
    background: var(--black-3);
    border: 1.5px solid var(--border);
    border-radius: 0.75rem;
    padding: 1rem 1.125rem;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    font-family: 'Inter', sans-serif;
  }
  .option-btn:hover:not(:disabled) {
    border-color: #555;
    background: var(--black-4);
    transform: scale(1.01);
  }
  .option-letter {
    width: 1.6rem; height: 1.6rem;
    border: 1.5px solid var(--border);
    border-radius: 0.35rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 800;
    color: var(--white-muted);
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .option-text {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--white);
    line-height: 1.4;
    padding-top: 0.1rem;
  }
  .option-btn.selected {
    border-color: var(--red);
    background: rgba(204,0,0,0.08);
  }
  .option-btn.selected .option-letter {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .option-btn.correct {
    border-color: #22C55E;
    background: rgba(34,197,94,0.08);
  }
  .option-btn.correct .option-letter {
    background: #22C55E;
    border-color: #22C55E;
    color: white;
  }
  .option-btn.wrong {
    border-color: var(--red);
    background: rgba(204,0,0,0.1);
  }
  .option-btn.wrong .option-letter {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .option-btn:disabled { cursor: not-allowed; }
  .quiz-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .quiz-score-live {
    font-size: 0.8rem; font-weight: 500; color: var(--white-muted);
  }
  .quiz-score-live strong { color: var(--white); font-weight: 700; }
  .btn-next {
    background: var(--black-3);
    border: 1.5px solid var(--border);
    border-radius: 0.625rem;
    padding: 0.7rem 1.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--white);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn-next:hover { border-color: var(--red); background: rgba(204,0,0,0.06); }
  .btn-next.active-next { background: var(--red); border-color: var(--red); }
  .btn-next.active-next:hover { background: #DD0000; }

  /* ===== RESULT SCREEN ===== */
  #screen-result { background: var(--black); }
  .result-container {
    flex: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
    width: 100%;
  }
  .result-header { margin-bottom: 2rem; }
  .result-outcome {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1.05;
  }
  .result-outcome.pass { color: var(--white); }
  .result-outcome.fail { color: var(--red); }
  .result-meta { font-size: 0.85rem; color: var(--white-muted); margin-top: 0.5rem; }
  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--black-2);
    border: 1px solid var(--border);
    border-radius: 0.875rem;
    padding: 1.25rem 1rem;
    text-align: center;
  }
  .stat-value { font-size: 2rem; font-weight: 800; line-height: 1; }
  .stat-label {
    font-size: 0.65rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--white-muted); margin-top: 0.35rem;
  }
  .stat-value.green { color: #22C55E; }
  .stat-value.red { color: var(--red); }
  .result-answers { margin-bottom: 2rem; }
  .result-answers-title {
    font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--white-muted); margin-bottom: 1rem;
  }
  .answer-row {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 1rem;
    background: var(--black-2);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    margin-bottom: 0.5rem;
  }
  .answer-dot {
    width: 1.4rem; height: 1.4rem;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 800;
    margin-top: 0.1rem;
  }
  .answer-dot.correct { background: #22C55E; color: white; }
  .answer-dot.wrong { background: var(--red); color: white; }
  .answer-q { font-size: 0.85rem; font-weight: 500; line-height: 1.45; color: var(--white); }
  .answer-detail {
    font-size: 0.75rem; margin-top: 0.3rem; line-height: 1.4;
  }
  .answer-detail .your { color: var(--red); }
  .answer-detail .right { color: #22C55E; }
  .result-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .btn-secondary {
    flex: 1;
    background: var(--black-2);
    border: 1.5px solid var(--border);
    border-radius: 0.625rem;
    padding: 0.85rem 1.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--white);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    min-width: 140px;
    text-align: center;
  }
  .btn-secondary:hover { border-color: var(--red); background: rgba(204,0,0,0.06); }

  /* ===== ENTER ANIMATION ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.35s ease forwards; }
  .fade-up-delay { animation: fadeUp 0.35s 0.12s ease both; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--black-3);
    border: 1px solid var(--border);
    border-radius: 0.625rem;
    padding: 0.7rem 1.25rem;
    font-size: 0.82rem; font-weight: 500;
    color: var(--white);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: rgba(204,0,0,0.5); color: #FF6666; }
  .toast.success { border-color: rgba(34,197,94,0.4); color: #4ADE80; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
</style>
</head>
<body>

<!-- ===================== SCREEN: MOBILE ===================== -->
<div id="screen-mobile" class="screen active">
  <div class="auth-bg-pattern"></div>
  <div class="auth-container">
    <div class="auth-card fade-up">
      <div class="nova-logo">NOVA<span>:</span>KBW</div>
      <div class="nova-sub">Kaun Banega Winner</div>
      <div class="divider"></div>
      <div style="margin-bottom:1.5rem;">
        <label class="form-label">मोबाइल नंबर दर्ज करें</label>
        <input id="mobile-input" class="form-input" type="tel" maxlength="10" placeholder="10 अंकों का नंबर" inputmode="numeric">
      </div>
      <button class="btn-primary" onclick="sendOTP()">OTP भेजें →</button>
      <div style="margin-top:1.25rem;" class="otp-hint">
        Demo के लिए OTP: <strong>123456</strong>
      </div>
    </div>
  </div>
</div>

<!-- ===================== SCREEN: OTP ===================== -->
<div id="screen-otp" class="screen">
  <div class="auth-bg-pattern"></div>
  <div class="auth-container">
    <div class="auth-card fade-up">
      <div class="nova-logo">NOVA<span>:</span>KBW</div>
      <div class="nova-sub">Kaun Banega Winner</div>
      <div class="divider"></div>
      <p style="font-size:0.82rem;color:var(--white-muted);margin-bottom:1.5rem;line-height:1.6;">
        <span id="otp-phone-display"></span> पर OTP भेजा गया है।
      </p>
      <div style="margin-bottom:1.5rem;">
        <label class="form-label">OTP दर्ज करें</label>
        <input id="otp-input" class="form-input" type="text" maxlength="6" placeholder="6 अंकों का कोड" inputmode="numeric">
      </div>
      <button class="btn-primary" onclick="verifyOTP()">जाँचें और आगे बढ़ें →</button>
      <div style="margin-top:1rem;text-align:center;">
        <button onclick="showScreen('screen-mobile')" style="background:none;border:none;color:var(--white-muted);font-size:0.8rem;cursor:pointer;font-family:Inter,sans-serif;">← वापस जाएं</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== SCREEN: PROFILE ===================== -->
<div id="screen-profile" class="screen">
  <div class="auth-bg-pattern"></div>
  <div class="auth-container">
    <div class="auth-card fade-up">
      <div class="nova-logo">NOVA<span>:</span>KBW</div>
      <div class="nova-sub">प्रोफाइल बनाएं</div>
      <div class="divider"></div>
      <div style="margin-bottom:1.25rem;">
        <label class="form-label">आपका नाम</label>

// ===================== STATE =====================
let state = {};
function loadState() {
  try { state = JSON.parse(localStorage.getItem('nova_kbw_state') || '{}'); } catch { state = {}; }
  if (!state.levels) state.levels = Array(10).fill(null).map(() => ({ unlocked: false, completed: false, score: 0 }));
  if (!state.levels[0]) state.levels[0] = { unlocked: false, completed: false, score: 0 };
  state.levels[0].unlocked = true;
  if (!state.totalScore) state.totalScore = 0;
}
function saveState() { localStorage.setItem('nova_kbw_state', JSON.stringify(state)); }

// Quiz runtime
let quizLevel = 0, quizQuestions = [], quizIndex = 0, quizScore = 0;
let quizWrong = 0, quizAnswers = [], quizTimer = null, quizSecondsLeft = 300, quizStartTime = 0;
let selectedOpt = null, answered = false;

// ===================== UI HELPERS =====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); }, 2600);
}

// ===================== AUTH =====================
let tempMobile = '';
function sendOTP() {
  const v = document.getElementById('mobile-input').value.trim();
  if (!/^\d{10}$/.test(v)) { showToast('कृपया 10 अंकों का सही नंबर दर्ज करें', 'error'); return; }
  tempMobile = v;
  document.getElementById('otp-phone-display').textContent = '+91 ' + v;
  showScreen('screen-otp');
  showToast('OTP भेजा गया! (Demo: 123456)', 'success');
}
function verifyOTP() {
  const v = document.getElementById('otp-input').value.trim();
  if (v !== '123456') { showToast('OTP गलत है। पुनः प्रयास करें।', 'error'); return; }
  if (state.name) { renderDashboard(); showScreen('screen-dashboard'); }
  else showScreen('screen-profile');
}
function saveProfile() {
  const name = document.getElementById('profile-name').value.trim();
  const age = parseInt(document.getElementById('profile-age').value);
  if (!name || name.length < 2) { showToast('कृपया अपना नाम दर्ज करें', 'error'); return; }
  if (!age || age < 10 || age > 100) { showToast('कृपया सही उम्र दर्ज करें', 'error'); return; }
  state.name = name; state.age = age; state.mobile = tempMobile;
  saveState(); renderDashboard(); showScreen('screen-dashboard');
  showToast('स्वागत है, ' + name + '! 🎯', 'success');
}

// ===================== DASHBOARD =====================
function renderDashboard() {
  loadState();
  // Profile chip
  const initials = (state.name || 'U').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const currentLevel = state.levels.findIndex(l => !l.completed) + 1 || 10;
  document.getElementById('profile-chip-wrap').innerHTML = `
    <div class="profile-chip">
      <div class="profile-avatar">${initials}</div>
      <div>
        <div class="profile-name">${state.name || 'प्रतिभागी'}</div>
        <div class="profile-meta">स्तर ${currentLevel} · ${state.age} वर्ष</div>
      </div>
    </div>`;
  document.getElementById('total-score-display').textContent = state.totalScore || 0;

  // Levels grid
  const grid = document.getElementById('levels-grid');
  grid.innerHTML = '';
  state.levels.forEach((lv, i) => {
    let cls = 'level-card locked', statusText = '🔒 बंद', statusCls = 'status-locked';
    if (lv.completed) { cls = 'level-card completed'; statusText = '✓ पूर्ण'; statusCls = 'status-completed'; }
    else if (lv.unlocked) {
      const isFirst = !state.levels.slice(0, i).some(l => !l.completed);
      cls = 'level-card unlocked' + (lv.unlocked && !lv.completed && i === state.levels.findIndex(l => l.unlocked && !l.completed) ? ' current' : '');
      statusText = '▶ शुरू करें'; statusCls = 'status-current';
      if (!isFirst && lv.unlocked && !lv.completed) { statusText = '▶ खेलें'; statusCls = 'status-unlocked'; }
    }
    grid.innerHTML += `
      <div class="${cls}" onclick="startLevel(${i})">
        <div class="level-num">स्तर ${i + 1} · 10 प्रश्न</div>
        <div class="level-title">${LEVELS[i].title}</div>
        <div class="level-desc">${LEVELS[i].desc}</div>
        <div class="level-footer">
          <div class="level-status ${statusCls}">${statusText}</div>
          <div class="level-score">${lv.completed ? '<span>' + lv.score + '</span>/10' : '—/10'}</div>
        </div>
      </div>`;
  });
}

// ===================== QUIZ =====================
function startLevel(levelIndex) {
  if (!state.levels[levelIndex].unlocked) { showToast('यह स्तर अभी बंद है। पहले पिछला स्तर पूरा करें।', 'error'); return; }
  quizLevel = levelIndex;
  const base = levelIndex * 10;
  const pool = ALL_QUESTIONS.slice(base, base + 10).map((q, i) => ({ ...q, origIdx: base + i }));
  quizQuestions = shuffle(pool);
  quizIndex = 0; quizScore = 0; quizWrong = 0; quizAnswers = [];
  selectedOpt = null; answered = false;
  quizSecondsLeft = 300;
  quizStartTime = Date.now();
  document.getElementById('quiz-level-badge').textContent = 'स्तर ' + (levelIndex + 1) + ' — ' + LEVELS[levelIndex].title;
  renderQuestion();
  startTimer();
  showScreen('screen-quiz');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function renderQuestion() {
  const q = quizQuestions[quizIndex];
  const letters = ['A', 'B', 'C', 'D'];
  selectedOpt = null; answered = false;
  document.getElementById('q-current').textContent = quizIndex + 1;
  document.getElementById('q-progress-fill').style.width = ((quizIndex + 1) / 10 * 100) + '%';
  document.getElementById('live-correct').textContent = quizScore;
  document.getElementById('live-wrong').textContent = quizWrong;
  const btn = document.getElementById('btn-next');
  btn.disabled = true; btn.classList.remove('active-next');
  btn.textContent = quizIndex < 9 ? 'अगला →' : 'परिणाम देखें';

  document.getElementById('quiz-main').innerHTML = `
    <div class="question-number fade-up">प्रश्न ${quizIndex + 1} / 10</div>
    <div class="question-text fade-up-delay">${q.q}</div>
    <div class="options-grid fade-up-delay">
      ${q.opts.map((o, i) => `
        <button class="option-btn" onclick="selectOption(${i})" id="opt-${i}">
          <div class="option-letter">${letters[i]}</div>
          <div class="option-text">${o}</div>
        </button>`).join('')}
    </div>`;
}

function selectOption(i) {
  if (answered) return;
  selectedOpt = i;
  answered = true;
  const q = quizQuestions[quizIndex];
  const correct = q.ans;
  const isCorrect = i === correct;
  if (isCorrect) quizScore++; else quizWrong++;
  quizAnswers.push({ q: q.q, opts: q.opts, correct, chosen: i, isCorrect });

  for (let j = 0; j < 4; j++) {
    const btn = document.getElementById('opt-' + j);
    if (!btn) continue;
    btn.disabled = true;
    if (j === correct) btn.classList.add('correct');
    else if (j === i && !isCorrect) btn.classList.add('wrong');
  }
  document.getElementById('live-correct').textContent = quizScore;
  document.getElementById('live-wrong').textContent = quizWrong;
  const nb = document.getElementById('btn-next');
  nb.disabled = false; nb.classList.add('active-next');
}

function nextQuestion() {
  if (!answered) { showToast('कोई विकल्प चुनें।', 'error'); return; }
  quizIndex++;
  if (quizIndex >= 10) { endQuiz(); return; }
  renderQuestion();
}

function startTimer() {
  clearInterval(quizTimer);
  updateTimerDisplay();
  quizTimer = setInterval(() => {
    quizSecondsLeft--;
    updateTimerDisplay();
    if (quizSecondsLeft <= 0) { clearInterval(quizTimer); endQuiz(true); }
  }, 1000);
}
function updateTimerDisplay() {
  const m = Math.floor(quizSecondsLeft / 60).toString().padStart(2, '0');
  const s = (quizSecondsLeft % 60).toString().padStart(2, '0');
  const el = document.getElementById('quiz-timer');
  if (!el) return;
  el.textContent = m + ':' + s;
  el.className = 'quiz-timer' + (quizSecondsLeft <= 30 ? ' danger' : quizSecondsLeft <= 60 ? ' warning' : '');
}

function endQuiz(timedOut = false) {
  clearInterval(quizTimer);
  // Fill skipped questions
  while (quizAnswers.length < 10) {
    const q = quizQuestions[quizAnswers.length];
    quizAnswers.push({ q: q.q, opts: q.opts, correct: q.ans, chosen: -1, isCorrect: false });
    if (!quizAnswers[quizAnswers.length-1].isCorrect) quizWrong++;
  }
  const timeTaken = Math.round((Date.now() - quizStartTime) / 1000);
  const passed = quizScore >= 5;
  // Update state
  loadState();
  if (passed) {
    state.levels[quizLevel].completed = true;
    state.levels[quizLevel].score = Math.max(state.levels[quizLevel].score || 0, quizScore);
    if (quizLevel + 1 < 10) state.levels[quizLevel + 1].unlocked = true;
    state.totalScore = (state.totalScore || 0) + quizScore;
  } else {
    state.levels[quizLevel].score = quizScore;
  }
  saveState();
  renderResult(passed, timeTaken, timedOut);
  showScreen('screen-result');
}

// ===================== RESULT =====================
function renderResult(passed, timeTaken, timedOut) {
  const mins = Math.floor(timeTaken / 60), secs = timeTaken % 60;
  const timeStr = (mins > 0 ? mins + ' मिनट ' : '') + secs + ' सेकंड';
  const letters = ['A', 'B', 'C', 'D'];
  const answersHTML = quizAnswers.map((a, i) => `
    <div class="answer-row">
      <div class="answer-dot ${a.isCorrect ? 'correct' : 'wrong'}">${a.isCorrect ? '✓' : '✗'}</div>
      <div>
        <div class="answer-q">${i + 1}. ${a.q}</div>
        <div class="answer-detail">
          ${!a.isCorrect ? `<span class="your">आपका: ${a.chosen >= 0 ? a.opts[a.chosen] : 'अनुत्तरित'} &nbsp;·&nbsp; </span>` : ''}
          <span class="right">सही: ${a.opts[a.correct]}</span>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('result-content').innerHTML = `
    <div class="result-header fade-up">
      <div style="font-size:0.7rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--red);margin-bottom:0.75rem;">
        स्तर ${quizLevel + 1} — ${LEVELS[quizLevel].title}
      </div>
      <div class="result-outcome ${passed ? 'pass' : 'fail'}">
        ${passed ? 'शानदार!<br>आप आगे बढ़े! 🎯' : 'अगली बार<br>जरूर जीतेंगे'}
      </div>
      <div class="result-meta">
        ${timedOut ? '⏱ समय समाप्त · ' : ''}${timeStr} में पूरा किया
        ${passed ? '&nbsp;· अगला स्तर खुल गया' : '&nbsp;· पुनः प्रयास करें (5+ सही चाहिए)'}
      </div>
    </div>
    <div class="result-stats fade-up-delay">
      <div class="stat-card">
        <div class="stat-value green">${quizScore}</div>
        <div class="stat-label">सही उत्तर</div>
      </div>
      <div class="stat-card">
        <div class="stat-value red">${quizWrong}</div>
        <div class="stat-label">गलत उत्तर</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--white);font-size:1.4rem;">${timeStr}</div>
        <div class="stat-label">लिया गया समय</div>
      </div>
    </div>
    <div class="result-answers fade-up">
      <div class="result-answers-title">उत्तर समीक्षा</div>
      ${answersHTML}
    </div>
    <div class="result-actions fade-up">
      ${!passed ? `<button class="btn-secondary" onclick="startLevel(${quizLevel})">↺ पुनः प्रयास</button>` : ''}
      <button class="btn-secondary" onclick="goDashboard()">↩ डैशबोर्ड</button>
      ${passed && quizLevel < 9 ? `<button class="btn-primary" style="flex:1;" onclick="startLevel(${quizLevel + 1})">अगला स्तर →</button>` : ''}
    </div>`;
}

function goDashboard() { renderDashboard(); showScreen('screen-dashboard'); }

// ===================== INIT =====================
loadState();
if (state.name) { renderDashboard(); showScreen('screen-dashboard'); }
else showScreen('screen-mobile');

// Enter key support
document.getElementById('mobile-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendOTP(); });
document.getElementById('otp-input').addEventListener('keydown', e => { if (e.key === 'Enter') verifyOTP(); });
</script>
